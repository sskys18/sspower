description = "List active Codex bridge sessions with phase and last event"
prompt = "Invoke the codex-tracking skill. List active Codex sessions via `node $BRIDGE ps` (resolve $BRIDGE via find ~/.claude/plugins -name codex-bridge.mjs -path '*/sspower/*' | head -1). For each session with status=running, fetch `status <id>` and report phase, last_event, duration_ms, and trace counters. If user provided a session id as {{args}}, fetch only that one. Format output terse — table for multiple sessions, formatted JSON for single. Include kill/steer/tail command hints if any are running."
